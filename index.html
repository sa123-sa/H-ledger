<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoque Fertilizer - Halkhata</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2e7d32; 
            --primary-dark: #1b5e20;
            --bg: #f4f6f4;
            --surface: #ffffff;
            --border: #e0e0e0;
            --text: #333333;
            --danger: #d32f2f;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text); padding-bottom: 60px; }
        
        .header { background-color: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .login-btn { background: transparent; border: 1px solid white; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        
        .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 12px; font-weight: bold; color: gray; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .search-container { padding: 10px; background: var(--surface); }
        .search-container input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; }
        
        .admin-panel { display: none; padding: 15px; background: #e8f5e9; border-bottom: 2px solid var(--primary); }
        .admin-panel.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .form-grid input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; }
        .form-grid .full-width { grid-column: span 2; }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; flex: 1; min-width: 100px; text-align: center; }
        .btn-green { background-color: var(--primary); }
        .btn-red { background-color: var(--danger); }
        .btn-purple { background-color: #6a1b9a; }
        .btn-blue { background-color: #1976d2; }
        .btn-gray { background-color: #616161; }
        
        .table-container { overflow-x: auto; background: var(--surface); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0; cursor: pointer; user-select: none; }
        th:hover { background-color: var(--primary-dark); }
        .sort-icon { font-size: 0.8em; margin-left: 4px; }
        
        .paid-cell { background-color: #e0f2f1; font-weight: bold; color: #00695c; text-align: center; border-radius: 4px; cursor: pointer; }
        .due-cell { font-weight: bold; cursor: pointer; }
        .edit-icon { cursor: pointer; color: #1976d2; font-size: 1.2rem; }
        .admin-edit-hint { border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
        
        .totals-row { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--primary-dark); color: white; display: flex; justify-content: space-around; padding: 12px; font-weight: bold; z-index: 100; font-size: 14px; }
        
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 999; justify-content: center; align-items: center; font-weight: bold; color: var(--primary); font-size: 1.2rem; }
        #syncToast { display: none; position: fixed; bottom: 60px; right: 20px; background: #323232; color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 101; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-box { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-box h3 { margin-top: 0; color: var(--primary); margin-bottom: 15px; }
        .modal-box p { margin: 0 0 15px 0; font-size: 14px; color: #555; }
        .modal-box input[type="number"] { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 16px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .print-checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .print-checkbox-group label { font-size: 15px; display: flex; align-items: center; gap: 8px; }

        @media print {
            .header, .tabs, .search-container, .admin-panel, .totals-row, .checkbox-col, .edit-col { display: none !important; }
            body { padding: 0; }
            table { min-width: 100%; }
            th, td { font-size: 14pt; padding: 4px; border: 1px solid #000; }
            th { font-size: 18pt; background-color: #eee !important; color: #000 !important; }
        }
    </style>
</head>
<body>

    <div id="loader">Fetching First Time...</div>
    <div id="syncToast">Background Sync...</div>

    <div id="paymentModalOverlay" class="modal-overlay">
        <div class="modal-box">
            <h3>Add Payment</h3>
            <p id="payModalName"></p>
            <input type="hidden" id="payModalId">
            <input type="number" id="payModalCash" placeholder="Add Cash (₹) - Leave blank if 0">
            <input type="number" id="payModalUpi" placeholder="Add UPI (₹) - Leave blank if 0">
            <div class="modal-btns">
                <button class="btn btn-green" onclick="savePayment()">Save Updates</button>
                <button class="btn btn-red" onclick="document.getElementById('paymentModalOverlay').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <div id="printModalOverlay" class="modal-overlay">
        <div class="modal-box">
            <h3>Select Columns to Print</h3>
            <div class="print-checkbox-group">
                <label><input type="checkbox" id="p_sl" checked> SL NO</label>
                <label><input type="checkbox" id="p_name" checked> NAME</label>
                <label><input type="checkbox" id="p_co"> C/O</label>
                <label><input type="checkbox" id="p_vill" checked> VILLAGE</label>
                <label><input type="checkbox" id="p_page" checked> PAGE NO</label>
                <label><input type="checkbox" id="p_due" checked> TOTAL DUE</label>
                <label><input type="checkbox" id="p_paid" checked> PAID AMOUNT</label>
                <label><input type="checkbox" id="p_remain" checked> REMAINING DUE</label>
            </div>
            <div class="modal-btns">
                <button class="btn btn-gray" onclick="executePrint()">Print Now</button>
                <button class="btn btn-red" onclick="document.getElementById('printModalOverlay').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <header class="header">
        <h1>Hoque Fertilizer</h1>
        <button class="login-btn" onclick="toggleAdmin()">Admin Login</button>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('Retail')">Retail</div>
        <div class="tab" onclick="switchTab('Wholesale')">Wholesale</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by Name, Village, or Page No..." onkeyup="renderTable()">
    </div>

    <div class="admin-panel" id="adminPanel">
        <input type="hidden" id="recordId">
        <div class="form-grid">
            <input type="text" id="pageNo" placeholder="PAGE NO">
            <input type="text" id="name" placeholder="NAME" class="full-width">
            <input type="text" id="co" placeholder="C/O">
            <input type="text" id="village" placeholder="VILLAGE">
            <input type="number" id="dueAmount" placeholder="DUE AMOUNT (₹)">
            <input type="number" id="cashPaid" placeholder="CASH PAID (₹)">
            <input type="number" id="upiPaid" placeholder="UPI PAID (₹)">
        </div>
        <div class="btn-group">
            <button class="btn btn-green" id="saveBtn" onclick="saveRecord()">Add Record</button>
            <button class="btn btn-red" onclick="deleteSelected()">Delete</button>
            <button class="btn btn-purple" onclick="document.getElementById('importFile').click()">Import</button>
            <button class="btn btn-blue" onclick="exportExcel()">Export</button>
            <button class="btn btn-gray" onclick="document.getElementById('printModalOverlay').style.display='flex'">Print</button>
            <input type="file" id="importFile" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(event)">
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="checkbox-col" style="display:none;">✓</th>
                    <th class="edit-col" style="display:none;">Edit</th>
                    <th>SL NO</th>
                    <th onclick="sortTable('NAME')">NAME <span class="sort-icon" id="sort-NAME"></span></th>
                    <th>C/O</th>
                    <th>VILLAGE</th>
                    <th onclick="sortTable('PAGE_NO')">PAGE NO <span class="sort-icon" id="sort-PAGE_NO"></span></th>
                    <th onclick="sortTable('DUE_AMOUNT')">TOTAL DUE <span class="sort-icon" id="sort-DUE_AMOUNT"></span></th>
                    <th>PAID AMOUNT</th>
                    <th>REMAINING DUE</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="totals-row">
        <span>Due: ₹<span id="sumDue">0</span></span>
        <span>Paid: ₹<span id="sumPaid">0</span></span>
        <span>Remain: ₹<span id="sumRemain">0</span></span>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykCOwEpkd-ejONhTw0JuyfUSMlYx8x17Uq7tyF6a0PdOjjkxfOkbJeLZo45wJU5_oD/exec";
    const ADMIN_PIN = "1234";

    let appData = { Retail: [], Wholesale: [] };
    let currentTab = "Retail";
    let isAdmin = false;
    let currentSort = { column: null, ascending: true };

    window.onload = () => { 
        if(localStorage.getItem('hoqueAdmin') === 'true') {
            isAdmin = true;
            document.querySelector('.login-btn').innerText = "Lock Admin";
            document.getElementById('adminPanel').classList.add('active');
        }
        fetchData(); 
    };

    function saveToLocalCache() {
        localStorage.setItem('hoqueData', JSON.stringify(appData));
    }

    async function fetchData() {
        const cached = localStorage.getItem('hoqueData');
        if (cached) {
            appData = JSON.parse(cached);
            renderTable();
        } else {
            document.getElementById('loader').style.display = 'flex';
        }

        try {
            const response = await fetch(SCRIPT_URL);
            const result = await response.json();
            if (result.status === "success") {
                // Bug Fix: Assign missing IDs directly so edit always works
                const ensureIds = (data) => data.map((r, i) => {
                    if (!r.ID || r.ID === "") r.ID = 'auto_' + Date.now() + '_' + i;
                    return r;
                });
                
                appData.Retail = ensureIds(result.retail || []);
                appData.Wholesale = ensureIds(result.wholesale || []);
                saveToLocalCache();
                renderTable(); 
            }
        } catch (error) { 
            console.log("Offline mode active.");
        }
        document.getElementById('loader').style.display = 'none';
    }

    function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        clearForm(); renderTable();
    }

    function toggleAdmin() {
        if (!isAdmin) {
            if (prompt("Enter Admin PIN:") === ADMIN_PIN) {
                isAdmin = true;
                localStorage.setItem('hoqueAdmin', 'true');
                document.querySelector('.login-btn').innerText = "Lock Admin";
                document.getElementById('adminPanel').classList.add('active');
            } else { alert("Incorrect PIN"); }
        } else {
            isAdmin = false;
            localStorage.removeItem('hoqueAdmin');
            document.querySelector('.login-btn').innerText = "Admin Login";
            document.getElementById('adminPanel').classList.remove('active');
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        let data = [...appData[currentTab]];
        const query = document.getElementById('searchInput').value.toLowerCase();

        if (query) {
            data = data.filter(r => 
                (r.NAME && r.NAME.toLowerCase().includes(query)) ||
                (r.VILLAGE && r.VILLAGE.toLowerCase().includes(query)) ||
                (r.CO && r.CO.toLowerCase().includes(query)) ||
                (r.PAGE_NO && r.PAGE_NO.toString().includes(query))
            );
        }

        if (currentSort.column) {
            data.sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];
                
                if (['DUE_AMOUNT', 'PAGE_NO'].includes(currentSort.column)) {
                    valA = parseFloat(valA) || 0; valB = parseFloat(valB) || 0;
                    return currentSort.ascending ? valA - valB : valB - valA;
                } else {
                    valA = valA ? valA.toString().toLowerCase() : ""; valB = valB ? valB.toString().toLowerCase() : "";
                    return currentSort.ascending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });
        }

        let sumDue = 0, sumPaid = 0, sumRemain = 0;
        document.querySelectorAll('.checkbox-col, .edit-col').forEach(el => el.style.display = isAdmin ? 'table-cell' : 'none');

        data.forEach((row, index) => {
            const due = parseFloat(row.DUE_AMOUNT) || 0;
            const cash = parseFloat(row.CASH_PAID) || 0;
            const upi = parseFloat(row.UPI_PAID) || 0;
            const totalPaid = cash + upi;
            const remaining = due - totalPaid;

            sumDue += due; sumPaid += totalPaid; sumRemain += remaining;
            
            // New class to indicate tap-to-edit
            const dueClass = isAdmin ? "due-cell admin-edit-hint" : "due-cell";

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="checkbox-col" style="display:${isAdmin ? 'table-cell' : 'none'};"><input type="checkbox" class="row-checkbox" value="${row.ID}"></td>
                <td class="edit-col" style="display:${isAdmin ? 'table-cell' : 'none'};"><span class="edit-icon" onclick="loadEditForm('${row.ID}')">✏️</span></td>
                <td>${index + 1}</td>
                <td class="${dueClass}" onclick="quickEditField('${row.ID}', 'NAME', 'Name')"><strong>${row.NAME || ''}</strong></td>
                <td class="${dueClass}" onclick="quickEditField('${row.ID}', 'CO', 'C/O')">${row.CO || ''}</td>
                <td class="${dueClass}" onclick="quickEditField('${row.ID}', 'VILLAGE', 'Village')">${row.VILLAGE || ''}</td>
                <td class="${dueClass}" onclick="quickEditField('${row.ID}', 'PAGE_NO', 'Page No')">${row.PAGE_NO || ''}</td>
                <td class="${dueClass}" onclick="quickEditDue('${row.ID}')">₹${due}</td>
                <td class="paid-cell" onclick="openPaymentModal('${row.ID}')">₹${totalPaid}</td>
                <td style="color:${remaining > 0 ? 'var(--danger)' : 'var(--primary)'}; font-weight:bold;">₹${remaining}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('sumDue').innerText = sumDue;
        document.getElementById('sumPaid').innerText = sumPaid;
        document.getElementById('sumRemain').innerText = sumRemain;
    }

    function sortTable(column) {
        if (currentSort.column === column) { currentSort.ascending = !currentSort.ascending; } 
        else { currentSort.column = column; currentSort.ascending = true; }
        
        document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = "");
        document.getElementById(`sort-${column}`).innerText = currentSort.ascending ? " ▲" : " ▼";
        renderTable();
    }

    async function silentDBAction(action, recordData) {
        const toast = document.getElementById('syncToast');
        toast.innerText = "Syncing in background...";
        toast.style.display = "block";
        
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: action, tab: currentTab, record: recordData }) });
            toast.innerText = "Saved to Cloud ✓";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        } catch (error) { 
            toast.innerText = "⚠️ Offline: Saved Locally Only"; 
            toast.style.backgroundColor = "var(--danger)";
            setTimeout(() => { toast.style.display = "none"; toast.style.backgroundColor = "#323232"; }, 3000);
        }
    }

    function saveRecord() {
        const isUpdate = document.getElementById('recordId').value !== "";
        const id = document.getElementById('recordId').value || Date.now().toString();
        
        const record = {
            ID: id, SL_NO: "", PAGE_NO: document.getElementById('pageNo').value,
            NAME: document.getElementById('name').value, CO: document.getElementById('co').value,
            VILLAGE: document.getElementById('village').value, DUE_AMOUNT: document.getElementById('dueAmount').value,
            CASH_PAID: document.getElementById('cashPaid').value, UPI_PAID: document.getElementById('upiPaid').value
        };

        if(!record.NAME) { alert("Name is required!"); return; }

        if (isUpdate) {
            const index = appData[currentTab].findIndex(r => r.ID == record.ID);
            appData[currentTab][index] = record;
        } else {
            appData[currentTab].push(record);
        }
        
        saveToLocalCache();
        renderTable();
        clearForm();
        silentDBAction(isUpdate ? "UPDATE" : "ADD", record);
    }

    // --- NEW: Universal Quick Edit Text ---
    function quickEditField(id, fieldName, displayName) {
        if (!isAdmin) return;
        const record = appData[currentTab].find(r => r.ID == id);
        const newValue = prompt(`Update ${displayName}:`, record[fieldName]);
        
        // Allows updating to a new string, or clearing it completely
        if (newValue !== null) { 
            record[fieldName] = newValue.trim();
            saveToLocalCache();
            renderTable(); 
            silentDBAction("UPDATE", record);
        }
    }

    function quickEditDue(id) {
        if (!isAdmin) return;
        const record = appData[currentTab].find(r => r.ID == id);
        const newDue = prompt(`Update Total Due Amount for ${record.NAME}:`, record.DUE_AMOUNT);
        
        if (newDue !== null && newDue.trim() !== "") {
            record.DUE_AMOUNT = parseFloat(newDue);
            saveToLocalCache();
            renderTable(); 
            silentDBAction("UPDATE", record);
        }
    }

    function openPaymentModal(id) {
        const record = appData[currentTab].find(r => r.ID == id);
        if (!isAdmin) {
            alert(`Payment Details for ${record.NAME}:\nCash: ₹${record.CASH_PAID || 0}\nUPI: ₹${record.UPI_PAID || 0}`);
            return;
        }
        
        document.getElementById('payModalId').value = id;
        document.getElementById('payModalName').innerText = `${record.NAME} (Current Paid: ₹${(parseFloat(record.CASH_PAID) || 0) + (parseFloat(record.UPI_PAID) || 0)})`;
        document.getElementById('payModalCash').value = '';
        document.getElementById('payModalUpi').value = '';
        document.getElementById('paymentModalOverlay').style.display = 'flex';
    }

    function savePayment() {
        const id = document.getElementById('payModalId').value;
        const cashAdd = parseFloat(document.getElementById('payModalCash').value) || 0;
        const upiAdd = parseFloat(document.getElementById('payModalUpi').value) || 0;

        if (cashAdd === 0 && upiAdd === 0) { document.getElementById('paymentModalOverlay').style.display='none'; return; }

        const record = appData[currentTab].find(r => r.ID == id);
        record.CASH_PAID = (parseFloat(record.CASH_PAID) || 0) + cashAdd;
        record.UPI_PAID = (parseFloat(record.UPI_PAID) || 0) + upiAdd;

        document.getElementById('paymentModalOverlay').style.display='none';
        saveToLocalCache();
        renderTable(); 
        silentDBAction("UPDATE", record); 
    }

    function loadEditForm(id) {
        const record = appData[currentTab].find(r => r.ID == id);
        if (!record) return;

        document.getElementById('recordId').value = record.ID;
        document.getElementById('pageNo').value = record.PAGE_NO || '';
        document.getElementById('name').value = record.NAME || '';
        document.getElementById('co').value = record.CO || '';
        document.getElementById('village').value = record.VILLAGE || '';
        document.getElementById('dueAmount').value = record.DUE_AMOUNT || '';
        document.getElementById('cashPaid').value = record.CASH_PAID || '';
        document.getElementById('upiPaid').value = record.UPI_PAID || '';

        document.getElementById('saveBtn').innerText = "Update Record";
        document.getElementById('saveBtn').classList.replace('btn-green', 'btn-blue');
        
        // Bug Fix: Force the screen to scroll to the very top so you can actually see the edit form
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearForm() {
        document.querySelectorAll('.form-grid input').forEach(input => input.value = '');
        document.getElementById('recordId').value = "";
        document.getElementById('saveBtn').innerText = "Add Record";
        document.getElementById('saveBtn').classList.replace('btn-blue', 'btn-green');
    }

    async function deleteSelected() {
        const checkboxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkboxes.length === 0 || !confirm(`Delete ${checkboxes.length} record(s)?`)) return;

        const idsToDelete = Array.from(checkboxes).map(box => box.value);
        appData[currentTab] = appData[currentTab].filter(r => !idsToDelete.includes(r.ID));
        saveToLocalCache();
        renderTable();

        document.getElementById('syncToast').style.display = "block";
        document.getElementById('syncToast').innerText = `Deleting ${idsToDelete.length} rows...`;
        for (let id of idsToDelete) {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "DELETE", tab: currentTab, record: { ID: id } }) });
        }
        document.getElementById('syncToast').innerText = "Deletion Complete ✓";
        setTimeout(() => { document.getElementById('syncToast').style.display = "none"; }, 2000);
    }

    function exportExcel() {
        const cleanData = appData[currentTab].map((row, index) => ({
            "SL NO": index + 1,
            "NAME": row.NAME || "",
            "C/O": row.CO || "",
            "VILLAGE": row.VILLAGE || "",
            "PAGE NO": row.PAGE_NO || "",
            "TOTAL DUE": parseFloat(row.DUE_AMOUNT) || 0,
            "CASH PAID": parseFloat(row.CASH_PAID) || 0,
            "UPI PAID": parseFloat(row.UPI_PAID) || 0
        }));

        const ws = XLSX.utils.json_to_sheet(cleanData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, currentTab);
        XLSX.writeFile(wb, `Hoque_Ledger_${currentTab}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function importExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            let recordsToAdd = [];
            for (let row of jsonData) {
                const name = row["NAME"] || row["Name"] || row["name"];
                if (!name) continue;

                const exists = appData[currentTab].some(r => 
                    r.NAME === name && 
                    r.VILLAGE === (row["VILLAGE"] || row["Village"] || "") &&
                    r.PAGE_NO == (row["PAGE NO"] || row["PAGE_NO"] || "")
                );
                
                if (exists) continue;

                recordsToAdd.push({
                    ID: Date.now().toString() + Math.floor(Math.random()*1000),
                    SL_NO: "", 
                    PAGE_NO: row["PAGE NO"] || row["PAGE_NO"] || "",
                    NAME: name,
                    CO: row["C/O"] || row["CO"] || "",
                    VILLAGE: row["VILLAGE"] || row["Village"] || "",
                    DUE_AMOUNT: row["TOTAL DUE"] || row["DUE_AMOUNT"] || row["Due"] || 0,
                    CASH_PAID: row["CASH PAID"] || row["CASH_PAID"] || 0,
                    UPI_PAID: row["UPI PAID"] || row["UPI_PAID"] || 0
                });
            }

            if (recordsToAdd.length === 0) {
                alert("No new records found. Perfect duplicates were skipped.");
                return;
            }

            recordsToAdd.forEach(r => appData[currentTab].push(r));
            saveToLocalCache();
            renderTable();
            document.getElementById('importFile').value = ""; 

            document.getElementById('syncToast').style.display = "block";
            for (let i = 0; i < recordsToAdd.length; i++) {
                document.getElementById('syncToast').innerText = `Syncing import ${i+1}/${recordsToAdd.length}...`;
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "ADD", tab: currentTab, record: recordsToAdd[i] }) });
            }
            document.getElementById('syncToast').innerText = "Import Sync Complete ✓";
            setTimeout(() => { document.getElementById('syncToast').style.display = "none"; }, 3000);
        };
        reader.readAsArrayBuffer(file);
    }

    function executePrint() {
        let style = document.createElement('style');
        style.id = 'dynamicPrintStyles';
        let css = '@media print { ';
        
        if (!document.getElementById('p_sl').checked) css += 'th:nth-child(3), td:nth-child(3) { display: none !important; } ';
        if (!document.getElementById('p_name').checked) css += 'th:nth-child(4), td:nth-child(4) { display: none !important; } ';
        if (!document.getElementById('p_co').checked) css += 'th:nth-child(5), td:nth-child(5) { display: none !important; } ';
        if (!document.getElementById('p_vill').checked) css += 'th:nth-child(6), td:nth-child(6) { display: none !important; } ';
        if (!document.getElementById('p_page').checked) css += 'th:nth-child(7), td:nth-child(7) { display: none !important; } ';
        if (!document.getElementById('p_due').checked) css += 'th:nth-child(8), td:nth-child(8) { display: none !important; } ';
        if (!document.getElementById('p_paid').checked) css += 'th:nth-child(9), td:nth-child(9) { display: none !important; } ';
        if (!document.getElementById('p_remain').checked) css += 'th:nth-child(10), td:nth-child(10) { display: none !important; } ';
        
        css += '}';
        style.innerHTML = css;
        document.head.appendChild(style);

        document.getElementById('printModalOverlay').style.display = 'none';
        window.print();

        setTimeout(() => {
            let existingStyle = document.getElementById('dynamicPrintStyles');
            if (existingStyle) existingStyle.remove();
        }, 1000);
    }
</script>
